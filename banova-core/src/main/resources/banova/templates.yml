    icon: NAME_TAG
    reason: "Using an inappropriate name, nickname or skin"
    aliases: ["nombre-o-skin", "nombre", "skin", "nick"]
    steps:
      - { type: kick }
      - { type: ban, duration: 1d }
      - { type: ban, duration: 7d }

  impersonation:
    name: "Impersonation"
    category: account
    icon: CARVED_PUMPKIN
    reason: "Impersonating staff or another player"
    aliases: ["suplantacion", "suplantar", "impostor", "falso-staff", "fake"]
    steps:
      - { type: kick }
      - { type: ban, duration: 3d }
      - { type: ban, duration: 14d }

  alt-abuse:
    name: "Account abuse"
    category: account
    icon: ARMOR_STAND
    reason: "Using extra accounts to gain an advantage"
    aliases: ["multicuentas", "multi", "multicuenta", "cuentas", "alts"]
    steps:
      - { type: ban, duration: 7d }
      - { type: ban, duration: perm }

  evasion:
    name: "Ban evasion"
    category: account
    icon: BARRIER
    reason: "Using another account to evade a sanction"
    aliases: ["evadir", "eva"]
    steps:
      - { type: ban, duration: perm, ip: true }

  staff-conduct:
    name: "Ignoring staff"
    category: account
    icon: GOLDEN_HELMET
    reason: "Repeatedly disregarding staff instructions"
    aliases: ["desobedecer-staff", "desobedecer", "desobediencia", "staff"]
    steps:
      - { type: warn, duration: 7d }
      - { type: ban, duration: 1d }
      - { type: ban, duration: 3d }
      - { type: ban, duration: 7d }

  real-money-trading:
    name: "Real-money trading"
    category: account
    icon: EMERALD
    reason: "Trading accounts, items or currency for real money"
    aliases: ["comercio-real", "rmt", "venta", "vender", "dinero-real", "compraventa"]
    steps:
      - { type: ban, duration: 14d }
      - { type: ban, duration: perm }
