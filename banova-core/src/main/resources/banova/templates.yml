    category: gameplay
    icon: EXPERIENCE_BOTTLE
    reason: "Manipulating rankings, rewards or kills"
    aliases: ["farmeo", "boost", "farmear", "estadisticas", "stats"]
    steps:
      - { type: warn, duration: 7d }
      - { type: ban, duration: 1d }
      - { type: ban, duration: 7d }
      - { type: ban, duration: 30d }

  scams:
