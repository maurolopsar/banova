# Banova - mensajes en español
# Colores: &a &c &7 ... y hex &#ff5555. Variables: {player}, {reason}...
# Las listas son mensajes de varias líneas.

prefix: "&8[&bBanova&8] &7"

format:
  permanent: "permanente"
  never: "nunca"
  ip-tag: " (IP)"
  silent-tag: " [silencioso]"

type:
  ban: "Baneo"
  mute: "Silencio"
  warn: "Aviso"
  kick: "Expulsión"

status:
  active: "activo"
  expired: "expirado"
  revoked: "retirado"
  done: "aplicado"

default-reason:
  ban: "Incumplir las normas"
  mute: "Incumplir las normas del chat"
  warn: "Incumplir las normas"
  kick: "Expulsado por el staff"
  revoke: "Sin motivo"
  warn-threshold: "Demasiados avisos ({count})"
  appeal-accepted: "Apelación aceptada"

screen:
  ban-permanent:
    - "&c&lEstás baneado de este servidor"
    - ""
    - "&7Motivo: &f{reason}"
    - "&7Por: &f{actor} &8| &7Fecha: &f{date}"
    - "&7Duración: &cPermanente"
    - ""
    - "{appeal}"
    - "&8ID #{id}"
  ban-temporary:
    - "&c&lEstás baneado temporalmente"
    - ""
    - "&7Motivo: &f{reason}"
    - "&7Por: &f{actor} &8| &7Fecha: &f{date}"
    - "&7Tiempo restante: &e{remaining} &8(hasta {expires})"
    - ""
    - "{appeal}"
    - "&8ID #{id}"
  kick:
    - "&c&lHas sido expulsado"
    - ""
    - "&7Motivo: &f{reason}"
    - "&7Por: &f{actor}"
  appeal-web: "&7¿Crees que es un error? Apela en &b{url}&7\n&7con el código &e&l{code}"
  appeal-link: "&7Apela en &b{url}"

mute:
  notify-permanent:
    - "&c&lHas sido silenciado permanentemente."
    - "&7Motivo: &f{reason} &8| &7Por: &f{actor}"
    - "&7Puedes apelar con &e/apelar &7(código &e{appeal_code}&7)"
  notify-temporary:
    - "&c&lHas sido silenciado durante {duration}."
    - "&7Motivo: &f{reason} &8| &7Por: &f{actor}"
    - "&7Puedes apelar con &e/apelar &7(código &e{appeal_code}&7)"
  chat-denied: "&cEstás silenciado &7(quedan {remaining}). &7Motivo: &f{reason} &8| &7Apelar: &e/apelar"
  command-denied: "&cNo puedes usar ese comando mientras estás silenciado."
  unmuted: "&aYa no estás silenciado."

warn:
  notify:
    - "&6&lAVISO &8» &e{reason}"
    - "&7Por: &f{actor} &8| &7Las próximas infracciones tendrán sanciones mayores."

broadcast:
  silent-prefix: "&8[Silencioso] "
  ban: "&c{player} &7ha sido baneado por &f{actor}&7: &f{reason}"
  ban-temp: "&c{player} &7ha sido baneado &f{duration} &7por &f{actor}&7: &f{reason}"
  mute: "&e{player} &7ha sido silenciado por &f{actor}&7: &f{reason}"
  mute-temp: "&e{player} &7ha sido silenciado &f{duration} &7por &f{actor}&7: &f{reason}"
  warn: "&6{player} &7ha recibido un aviso de &f{actor}&7: &f{reason}"
  warn-temp: "&6{player} &7ha recibido un aviso de &f{actor}&7: &f{reason}"
  kick: "&7{player} ha sido expulsado por &f{actor}&7: &f{reason}"
  revoke-ban: "{prefix}&a{player} &7ha sido desbaneado por &f{revoked_by} &8(#{id})"
  revoke-mute: "{prefix}&a{player} &7ya puede hablar, por &f{revoked_by} &8(#{id})"
  revoke-warn: "{prefix}&7El aviso #{id} de &a{player} &7ha sido retirado por &f{revoked_by}"

punish:
  success: "{prefix}&a{type}{ip} aplicado a &f{player} &8(&7{duration}&8) &8#{id}{silent}"
  replaced: "{prefix}&7Ha sustituido a la sanción anterior &8#{id}&7."

revoke:
  success: "{prefix}&a{type} &8#{id} &ade &f{player} &aretirado."
  not-active: "{prefix}&cLa sanción #{id} no está activa."
  none-ban: "{prefix}&c{player} no está baneado."
  none-mute: "{prefix}&c{player} no está silenciado."
  none-warn: "{prefix}&c{player} no tiene avisos activos."

error:
  usage: "{prefix}&cUso: &f{usage}"
  no-permission: "{prefix}&cNo tienes permiso para hacer eso."
  player-not-found: "{prefix}&cNo se ha encontrado al jugador &f{player}&c."
  punishment-not-found: "{prefix}&cNo existe la sanción &f{id}&c."
  not-online: "{prefix}&c{player} no está conectado."
  self: "{prefix}&cNo puedes sancionarte a ti mismo."
  limit: "{prefix}&cTu rango puede sancionar como máximo &f{max}&c (sin sanciones permanentes)."
  exempt: "{prefix}&c{player} no puede ser sancionado."
  no-ip: "{prefix}&cTodavía no se conoce la IP de {player}."
  already-ban: "{prefix}&c{player} ya está baneado (#{id})."
  already-mute: "{prefix}&c{player} ya está silenciado (#{id})."
  wrong-type: "{prefix}&cLa sanción #{id} es de tipo {type}."
  invalid-duration: "{prefix}&cDuración no válida &f{input}&c. Ejemplos: 30m, 2h, 7d, 1mo, perm"
  players-only: "{prefix}&cSolo los jugadores pueden hacer eso."
  database: "{prefix}&cError de base de datos, revisa la consola."
  internal: "{prefix}&cAlgo ha fallado, revisa la consola."

usage:
  ban: "/ban <jugador> [duración] [motivo] [-s]"
  tempban: "/tempban <jugador> <duración> [motivo] [-s]"
  ipban: "/ipban <jugador|ip> [duración] [motivo] [-s]"
  mute: "/mute <jugador> [duración] [motivo] [-s]"
  tempmute: "/tempmute <jugador> <duración> [motivo] [-s]"
  ipmute: "/ipmute <jugador|ip> [duración] [motivo] [-s]"
  warn: "/warn <jugador> [duración] [motivo] [-s]"
  kick: "/kick <jugador> [motivo] [-s]"
  unban: "/unban <jugador|ip|#id> [motivo]"
  unmute: "/unmute <jugador|ip|#id> [motivo]"
  unwarn: "/unwarn <jugador|#id> [motivo]"
  punish: "/punish <jugador> [plantilla] [-s]"
  history: "/history <jugador> [página] [tipo]"
  check: "/check <jugador>"
  banlist: "/banlist [página]"
  mutelist: "/mutelist [página]"
  warnings: "/warnings [página]"
  alts: "/alts <jugador>"
  staffhistory: "/staffhistory <staff> [página]"
  staffrollback: "/staffrollback <staff> <tiempo>"
  note: "/note <jugador> <texto>"
  notes: "/notes <jugador> | /notes delete <id>"
  evidence: "/evidence <#id> [enlace o texto] | /evidence remove <id>"
  appeal: "/apelar <mensaje>"
  appeals: "/appeals [view|accept|deny] [id] [respuesta]"
  lockdown: "/lockdown [on [motivo] | off]"
  banova: "/banova help"

template:
  list-header: "{prefix}&fPlantillas para &e{player}&f (clic para aplicar):"
  list-line: " &8» &e{name} &8(&7{id}&8) &7→ siguiente: &f{type} {duration} &8(paso {step}/{steps})"
  click-hover: "&aClic para aplicar"
  unknown: "{prefix}&cNo existe la plantilla &f{template}&c."
  applied: "{prefix}&a{template} &7(paso {step}/{steps}) &a→ {type} {duration} a &f{player} &8#{id}"

history:
  empty: "{prefix}&7{player} no tiene sanciones."
  header: "{prefix}&fHistorial de &e{player} &8({total})"

list:
  line: " &8#{id} &f{type}{ip} &e{player} &8| &7{duration} &8| &7{status} &8| &7por {actor} &8| &f{reason}"
  hover: "&7Clic para ver detalles"
  page: "&7Página {page}/{pages} &8» &aclic para la siguiente"
  next-page: "&aSiguiente página"
  empty: "{prefix}&7No hay nada que mostrar."
  header: "{prefix}&f{type} activos &8({total})"

check:
  header: "{prefix}&f{player} &8({uuid})"
  not-banned: " &a✔ No está baneado"
  not-muted: " &a✔ No está silenciado"
  stats: " &7Avisos activos: &f{warns} &8| &7Total: &f{total} &8| &7Notas: &f{notes} &8| &7Cuentas: &f{alts}"
  seen: " &7Primera vez: &f{first} &8| &7Última vez: &f{last}"
  online-now: "conectado ahora"
  ip: " &7IP: &f{ip}"
  history-button: " &e[Abrir historial]"

alts:
  none: "{prefix}&7Ninguna otra cuenta comparte IP con {player}."
  header: "{prefix}&fCuentas vinculadas a &e{player} &8({count}):"
  legend: "&8Leyenda: &cbaneado &6silenciado &aconectado &7desconectado"
  color-banned: "&c"
  color-muted: "&6"
  color-online: "&a"
  color-offline: "&7"
  evasion-alert: "{prefix}&c⚠ &f{player} &7comparte IP con cuenta(s) baneada(s): &c{alts}"

staff:
  history-empty: "{prefix}&7{staff} no ha sancionado a nadie."
  history-header: "{prefix}&fSanciones puestas por &e{staff} &8({total})"
  rollback-confirm: "{prefix}&eSe retirarán &f{count} &esanciones activas puestas por &f{staff} &een las últimas &f{time}&e."
  rollback-button: "&c&l[Clic para confirmar el rollback]"
  rollback-done: "{prefix}&aSe han retirado &f{count} &asanciones puestas por &f{staff}&a."

notes:
  added: "{prefix}&aNota &8#{id} &aañadida a &f{player}&a."
  deleted: "{prefix}&aNota #{id} borrada."
  not-found: "{prefix}&cNo existe la nota #{id}."
  empty: "{prefix}&7{player} no tiene notas."
  header: "{prefix}&fNotas de &e{player} &8({count})"
  line: " &8#{id} &7{date} &8| &e{actor}&8: &f{text}"
  hover-delete: "&cClic para borrar"

evidence:
  empty: "{prefix}&7La sanción #{id} no tiene pruebas. Añádelas con &e/evidence #{id} <enlace>"
  header: "{prefix}&fPruebas de &e#{id} &8({count})"
  line: " &8#{eid} &7{date} &8| &e{actor}&8: &f{text}"
  hover-open: "&aClic para abrir"
  added: "{prefix}&aPrueba &8#{eid} &aañadida a la sanción &f#{id}&a."
  removed: "{prefix}&aPrueba #{eid} borrada."
  not-found: "{prefix}&cNo existe la prueba #{eid}."

appeal:
  disabled: "{prefix}&cLas apelaciones están desactivadas."
  not-found: "{prefix}&cCódigo de apelación no encontrado."
  not-appealable: "{prefix}&cEsta sanción no se puede apelar."
  not-active: "{prefix}&cEsta sanción ya no está activa."
  already-pending: "{prefix}&eYa tienes una apelación pendiente de revisión."
  limit-reached: "{prefix}&cYa no puedes apelar esta sanción más veces."
  cooldown: "{prefix}&cTu última apelación fue rechazada. Podrás apelar de nuevo en &f{time}&c."
  nothing: "{prefix}&7Ahora mismo no tienes nada que apelar."
  how: "{prefix}&fTu {type}: &7{reason}\n&7Explica por qué debería retirarse: &e/apelar <mensaje> &8(mín. {min} caracteres)"
  too-short: "{prefix}&cEscribe al menos {min} caracteres."
  sent: "{prefix}&aApelación #{id} enviada. El staff la revisará pronto. Consúltala con &e/apelar estado&a."
  status-line: " &8#{id} &f{type} &8» &e{status} &8| &7{response}"
  status-none: "{prefix}&7No has enviado ninguna apelación."
  status-pending: "pendiente"
  status-accepted: "aceptada"
  status-denied: "rechazada"
  staff-alert: "{prefix}&b✉ Nueva apelación #{id} de &f{player} &7({type}). &e/appeals"

appeals:
  none-pending: "{prefix}&aNo hay apelaciones pendientes."
  header: "{prefix}&fApelaciones pendientes &8({total})"
  line: " &8#{id} &e{player} &8| &7{type} &8| &7{date} &8| &f{message}"
  view-header: "{prefix}&fApelación &e#{id} &8({status})"
  view-message: " &7Mensaje: &f{message}\n &7Contacto: &f{contact} &8| &7Enviada: &f{date}"
  view-handled: " &7Revisada por &f{actor} &7el {date}: &f{response}"
  button-accept: " &a&l[ACEPTAR]"
  button-deny: " &c&l[RECHAZAR]"
  accepted: "{prefix}&aApelación #{id} aceptada, sanción retirada."
  denied: "{prefix}&eApelación #{id} rechazada."
  already-handled: "{prefix}&cLa apelación #{id} ya fue revisada."
  not-found: "{prefix}&cNo existe la apelación {id}."

lockdown:
  default-reason: "Mantenimiento"
  enabled: "{prefix}&c&lCierre ACTIVADO &7por {actor}: &f{reason}"
  disabled: "{prefix}&a&lCierre DESACTIVADO &7por {actor}"
  not-active: "{prefix}&7El cierre no está activo."
  status-on: "{prefix}&cEl servidor está cerrado: &f{reason}"
  status-off: "{prefix}&aEl servidor está abierto."
  screen:
    - "&c&lEl servidor está cerrado ahora mismo"
    - ""
    - "&7{reason}"
    - "&7Vuelve a intentarlo más tarde."

admin:
  reloaded: "{prefix}&aConfiguración, plantillas, filtro y mensajes recargados."
  reload-failed: "{prefix}&cError al recargar: {error}"
  version: "{prefix}&fBanova &e{version} &7en {platform} &8| &7almacenamiento: &f{storage} &8| &7web: &f{web}"

info:
  details:
    - "{prefix}&f{type}{ip} &8#{id} &7— &e{player}"
    - " &7Motivo: &f{reason}"
    - " &7Por: &f{actor} &8| &7Fecha: &f{date} &8| &7Servidor: &f{server}"
    - " &7Duración: &f{duration} &8| &7Expira: &f{expires} &8| &7Estado: &f{status}{silent}"
    - " &7Código de apelación: &f{appeal_code}"
  revoked: " &7Retirada por &f{revoked_by}&7: &f{revoke_reason}"
  evidence: " &7Pruebas ({count}):"
  button-revoke: " &c&l[RETIRAR]"
  button-evidence: " &b&l[AÑADIR PRUEBA]"

edit:
  done: "{prefix}&aSanción #{id} actualizada."
  not-lasting: "{prefix}&cLas expulsiones no tienen duración."

audit:
  empty: "{prefix}&7El registro de auditoría está vacío."
  header: "{prefix}&fRegistro de auditoría &8(página {page})"
  line: " &8{date} &e{actor} &7{action} &f{target} &8{details} &8[{source}]"

import:
  usage: "{prefix}&fUso: &e/banova import <origen>&f. Orígenes: &7{sources}"
  unknown: "{prefix}&cOrigen desconocido {source}. Disponibles: {sources}"
  busy: "{prefix}&cYa hay una importación en curso."
  reading: "{prefix}&7Leyendo datos de &f{source}&7..."
  failed: "{prefix}&cLa importación ha fallado: &f{error}"
  preview: "{prefix}&fSe han encontrado &e{count} &fregistros en {source} (&e{active}&f activos). Todavía no se ha cambiado nada."
  confirm-button: "&a&l[Clic para importar ahora]"
  progress: "{prefix}&7Importados {done}/{total}..."
  done: "{prefix}&aImportación terminada: &f{imported} &aimportados, &f{skipped} &7ya existían, &c{failed} &7fallidos."
  backend-only: "Ejecuta esta importación en el servidor de juego donde estaba instalado ese plugin."
  litebans-h2: "LiteBans usa su archivo H2 local, que no se puede leer directamente. Cambia LiteBans a MySQL/MariaDB (LiteBans puede migrar sus propios datos) y vuelve a importar."
  advancedban-local: "AdvancedBan usa su almacenamiento local. Pon 'UseMySQL: true' en AdvancedBan (puede migrar sus datos) y vuelve a importar."

help:
  header: "{prefix}&fBanova &e{version} &7— haz clic en un comando"
  hover: "&7Clic para escribirlo"
  lines:
    - " &e/punish <jugador> &7— menú de sanciones con escalado automático"
    - " &e/ban /tempban /ipban <jugador> [tiempo] [motivo] &7— banear (-s silencioso)"
    - " &e/mute /tempmute /ipmute <jugador> [tiempo] [motivo] &7— silenciar"
    - " &e/warn /kick <jugador> [motivo] &7— avisar o expulsar"
    - " &e/unban /unmute /unwarn <jugador|#id> &7— retirar"
    - " &e/history /check /alts <jugador> &7— consultar a un jugador"
    - " &e/note /notes <jugador> &7— notas privadas del staff"
    - " &e/evidence <#id> <enlace> &7— adjuntar pruebas"
    - " &e/appeals &7— revisar apelaciones"
    - " &e/banlist /mutelist /warnings &7— sanciones activas"
    - " &e/staffhistory /staffrollback <staff> &7— herramientas de staff"
    - " &e/lockdown &7— cerrar el servidor a quien no sea staff"
    - " &e/banova web &7— abrir el panel web"
    - " &e/banova audit|import|reload|version &7— administración"

web:
  disabled: "{prefix}&cEl panel web está desactivado. Pon web.enabled: true en config.yml y usa /banova reload."
  info: "{prefix}&fPanel web: &b{url}"
  login-link: "{prefix}&a&l[Haz clic aquí para entrar al panel web]"
  login-link-hover: "&7Enlace de un solo uso, válido 3 minutos"
  code-approved: "{prefix}&aInicio de sesión web aprobado."
  code-approved-details: "{prefix}&7Navegador: &f{browser} &8| &7IP: &f{ip}&7. Si no has sido tú, usa &e/banova web logout all"
  code-invalid: "{prefix}&cEse código no es válido o ha caducado. Recarga la página web para obtener otro."
  no-sessions: "{prefix}&7No hay sesiones web activas."
  sessions-header: "{prefix}&fSesiones web &8({count}) &7— clic para cerrar"
  session-line: " &8{id} &e{name} &8| &7último uso {last} &8| &7{ip}"
  hover-logout: "&cClic para cerrar esta sesión"
  logged-out: "{prefix}&a{count} sesión(es) cerrada(s)."

filter:
  blocked-spam-fast: "&cEstás escribiendo demasiado rápido."
  blocked-spam-repeat: "&cNo repitas el mismo mensaje."
  blocked-advertising: "&cNo está permitido hacer publicidad."
  blocked-custom: "&cEse mensaje no está permitido."
  blocked-words: "&cCuida tu lenguaje."
  staff-alert: "&8[&cFiltro&8] &e{player} &8({rule})&7: &f{message}"
  auto-reason: "automático, filtro de chat"

discord:
  reason: "Motivo"
  staff: "Staff"
  duration: "Duración"
  server: "Servidor"
  silent: "Silencioso"
  revoked: "Retirado"
  new-appeal: "Nueva apelación"
  punishment: "Sanción"

