# ============================================================
#  Banova - plantillas de sanción (escalado automático)
#
#  El staff elige una plantilla (/punish <jugador> o el menú) y Banova
#  aplica el SIGUIENTE paso para ese jugador: primera infracción -> paso 1,
#  segunda -> paso 2... A partir del último paso se repite el último.
#
#  type:        ban | mute | warn | kick
#  duration:    30m, 6h, 7d, 1mo, perm ...
#  ip:          true para sancionar también la IP (opcional)
#  reset-after: las infracciones más antiguas no cuentan (perm = nunca se reinicia)
#  permission:  permiso opcional necesario para usar la plantilla
#  category:   fila del expediente: chat | gameplay | account (predeterminada)
#  icon:        objeto del menú (nombre de material de Minecraft)
#
#  Las sanciones retiradas (por ejemplo, apelaciones aceptadas) nunca cuentan.
# ============================================================
templates:
  insults:
    name: "Insultos"
    category: chat
    icon: PAPER
    reason: "Insultar o faltar al respeto"
    aliases: ["insultos", "insulto", "ins", "respeto", "faltas", "faltar"]
    steps:
      - { type: warn, duration: 7d }
      - { type: mute, duration: 15m }
      - { type: mute, duration: 1h }
      - { type: mute, duration: 6h }
      - { type: mute, duration: 1d }
      - { type: mute, duration: 3d }

  chat:
    name: "Spam"
